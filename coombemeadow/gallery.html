    <script>
        document.querySelectorAll('a[href="#book"]').forEach((bookLink) => {
            bookLink.addEventListener('click', () => {
                const targetButton = document.querySelector('#book .button');

                if (!targetButton) {
                    return;
                }

                window.setTimeout(() => {
                    targetButton.classList.remove('button-flash');
                    void targetButton.offsetWidth;
                    targetButton.classList.add('button-flash');
                }, 450);
            });
        });
    </script>
